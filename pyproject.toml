[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dayglass"
version = "0.1.0"
description = "A minimalist floating daily planner for Ubuntu"
requires-python = ">=3.14"
dependencies = ["PySide6>=6.9,<7", "Pillow>=11,<14"]

[project.scripts]
dayglass = "dayglass.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
